AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Media Processor - AI-Powered Image Tagger

Resources:

  AuthCognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - AttributeDataType: String
          Name: email
          Required: false

  AuthCognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AuthCognitoUserPool
      ClientName: !Sub "${AWS::StackName}-user-pool-client"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  MediaProcessorApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${AWS::StackName}-image-api"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - GET
          - OPTIONS 
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 3000
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AuthCognitoUserPool}"
              Audience:
                - !Ref AuthCognitoUserPoolClient
        DefaultAuthorizer: CognitoJwtAuthorizer

  ImageMetadataTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000

  GetUploadUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: get-upload-url.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      LoggingConfig:
        LogGroup: !Ref GetUploadUrlLogGroup
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MediaProcessorApi
            Path: /upload
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        External:
          - "@aws-sdk/*"
        Format: "cjs"
        EntryPoints:
          - get-upload-url.ts

  ImageEventsTopic:
    Type: AWS::SNS::Topic

  # Fan-out: every consumer gets its own queue (with its own DLQ) subscribed to the topic.
  # A new consumer is a new queue, a subscription and a function; nothing here changes.
  AnalyzerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days, the maximum

  AnalyzerQueue:
    Type: AWS::SQS::Queue
    Properties:
      # 6x the analyzer's timeout (30 s), so a message isn't handed to a second invocation
      # while the first may still be working on it.
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalyzerDeadLetterQueue.Arn
        maxReceiveCount: 3

  AnalyzerQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AnalyzerQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AnalyzerQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref ImageEventsTopic

  AnalyzerSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ImageEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt AnalyzerQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - ObjectCreated

  AnalyzerDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A message gave up in the analyzer queue and is waiting in its DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AnalyzerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ImageDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ImageDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: image-dispatcher.handler
      Runtime: nodejs20.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ImageDispatcherLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref ImageMetadataTable
          TOPIC_ARN: !Ref ImageEventsTopic
      Policies:
        # It writes the item, reads it back on a duplicate event, and publishes. It never reads S3.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt ImageMetadataTable.Arn
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ImageEventsTopic.TopicName
      Events:
        NewFileEvent:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        External:
          - "@aws-sdk/*"
        Format: "cjs"
        EntryPoints:
          - image-dispatcher.ts

  ImageAnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ImageAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: image-analyzer.handler
      Runtime: nodejs20.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ImageAnalyzerLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref ImageMetadataTable
      Events:
        AnalyzerQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalyzerQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
      Policies:
        - RekognitionDetectOnlyPolicy: {}
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        # It only ever updates the analysis attribute of an existing item.
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ImageMetadataTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        External:
          - "@aws-sdk/*"
        Format: "cjs"
        EntryPoints:
          - image-analyzer.ts

Outputs:
  ApiUrl:
    Description: "API Gateway HTTP API endpoint URL"
    Value: !Sub "https://${MediaProcessorApi}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Description: "Upload bucket name"
    Value: !Ref UploadBucket
  TableName:
    Description: "DynamoDB table name"
    Value: !Ref ImageMetadataTable
  AnalyzerDeadLetterQueueUrl:
    Description: "Where analyzer messages land after 3 failed attempts"
    Value: !Ref AnalyzerDeadLetterQueue
  UserPoolId:
    Description: "Cognito User Pool ID for authentication"
    Value: !Ref AuthCognitoUserPool
  UserPoolClientId:
    Description: "Cognito User Pool App Client ID"
    Value: !Ref AuthCognitoUserPoolClient
  UserPoolIssuerUrl:
    Description: "Cognito User Pool Issuer URL for JWT validation"
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AuthCognitoUserPool}"