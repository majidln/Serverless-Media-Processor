AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Darkroom - a serverless, event-driven image pipeline (S3, SNS, SQS, Lambda, Rekognition, DynamoDB)

# Layout: shared settings, then one section per part of the pipeline in the order a request flows:
# auth -> API -> storage -> upload -> fan-out topic -> dispatcher -> analyzer -> resizer -> outputs.
#
# Logical IDs are part of the deployed stack. Renaming one makes CloudFormation replace the
# resource, which for the user pool, table and bucket means losing users and data. Don't rename
# them as a tidy-up.

Parameters:
  LogRetentionDays:
    Type: Number
    Default: 14
    Description: How long each Lambda function keeps its logs
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

# Settings every function shares. Memory and timeout stay on the functions that set them,
# because the upload function intentionally keeps the Lambda defaults.
Globals:
  Function:
    CodeUri: functions/
    Runtime: nodejs20.x
    Architectures:
      - arm64

# SAM has no Globals for Metadata and CloudFormation doesn't support YAML anchors, so the esbuild
# block is repeated per function. Only EntryPoints differs. @aws-sdk/* is left out of the bundle
# because the Node.js runtime already provides it.

Resources:

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  AuthCognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - AttributeDataType: String
          Name: email
          Required: false

  AuthCognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AuthCognitoUserPool
      ClientName: !Sub "${AWS::StackName}-user-pool-client"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ---------------------------------------------------------------------------
  # API: every route needs a valid Cognito JWT unless it says otherwise
  # ---------------------------------------------------------------------------

  DarkroomApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${AWS::StackName}-image-api"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - GET
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 3000
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AuthCognitoUserPool}"
              Audience:
                - !Ref AuthCognitoUserPoolClient
        DefaultAuthorizer: CognitoJwtAuthorizer

  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------

  ImageMetadataTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3000

  # The resizer writes here and never into UploadBucket: a file written into the upload bucket
  # would trigger the dispatcher again and loop. Nothing here is public.
  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------------
  # Upload: POST /upload returns a presigned PUT URL for a server-generated key
  # ---------------------------------------------------------------------------

  GetUploadUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: get-upload-url.handler
      LoggingConfig:
        LogGroup: !Ref GetUploadUrlLogGroup
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadBucket
      Events:
        UploadApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref DarkroomApi
            Path: /upload
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        External:
          - "@aws-sdk/*"
        Format: "cjs"
        EntryPoints:
          - src/get-upload-url.ts

  # ---------------------------------------------------------------------------
  # Fan-out topic: the dispatcher publishes each upload here once, and every consumer
  # gets its own queue (with its own DLQ) subscribed to it. A new consumer is a new
  # queue, subscription and function; nothing in this section changes.
  # ---------------------------------------------------------------------------

  ImageEventsTopic:
    Type: AWS::SNS::Topic

  # ---------------------------------------------------------------------------
  # Dispatcher: S3 upload -> item in DynamoDB -> message on the topic
  # ---------------------------------------------------------------------------

  ImageDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  ImageDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: image-dispatcher.handler
      MemorySize: 256
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ImageDispatcherLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref ImageMetadataTable
          TOPIC_ARN: !Ref ImageEventsTopic
      Policies:
        # It writes the item, reads it back on a duplicate event, and publishes. It never reads S3.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt ImageMetadataTable.Arn
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ImageEventsTopic.TopicName
      Events:
        NewFileEvent:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        External:
          - "@aws-sdk/*"
        Format: "cjs"
        EntryPoints:
          - src/image-dispatcher.ts

  # ---------------------------------------------------------------------------
  # Analyzer: queue -> Rekognition labels -> analysis attribute in DynamoDB
  # A message that fails 3 times moves to the DLQ, and the alarm fires.
  # ---------------------------------------------------------------------------

  AnalyzerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days, the maximum

  AnalyzerQueue:
    Type: AWS::SQS::Queue
    Properties:
      # 6x the analyzer's timeout (30 s), so a message isn't handed to a second invocation
      # while the first may still be working on it.
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalyzerDeadLetterQueue.Arn
        maxReceiveCount: 3

  # Only this topic may send to this queue.
  AnalyzerQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AnalyzerQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AnalyzerQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref ImageEventsTopic

  AnalyzerSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ImageEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt AnalyzerQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - ObjectCreated

  AnalyzerDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A message gave up in the analyzer queue and is waiting in its DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AnalyzerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ImageAnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  ImageAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: image-analyzer.handler
      MemorySize: 256
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ImageAnalyzerLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref ImageMetadataTable
      Events:
        AnalyzerQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalyzerQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
      Policies:
        - RekognitionDetectOnlyPolicy: {}
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        # It only ever updates the analysis attribute of an existing item.
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ImageMetadataTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        External:
          - "@aws-sdk/*"
        Format: "cjs"
        EntryPoints:
          - src/image-analyzer.ts

  # ---------------------------------------------------------------------------
  # Resizer: queue -> thumb and medium WebP copies in ProcessedBucket -> resize attribute in
  # DynamoDB. Independent of the analyzer: its own queue, DLQ, alarm and attribute.
  # ---------------------------------------------------------------------------

  # sharp is native code, so it ships as a layer built for Linux arm64 (see layers/sharp/.npmrc)
  # instead of being bundled by esbuild.
  SharpLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-sharp"
      Description: sharp (libvips) for Linux arm64
      ContentUri: layers/sharp/
      CompatibleRuntimes:
        - nodejs20.x
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: nodejs20.x
      BuildArchitecture: arm64

  ResizerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days, the maximum

  ResizerQueue:
    Type: AWS::SQS::Queue
    Properties:
      # 6x the resizer's timeout (60 s).
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ResizerDeadLetterQueue.Arn
        maxReceiveCount: 3

  # Only this topic may send to this queue.
  ResizerQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ResizerQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ResizerQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref ImageEventsTopic

  ResizerSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ImageEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt ResizerQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        eventType:
          - ObjectCreated

  ResizerDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A message gave up in the resizer queue and is waiting in its DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ResizerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ImageResizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  ImageResizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: image-resizer.handler
      MemorySize: 1024
      Timeout: 60
      Layers:
        - !Ref SharpLayer
      LoggingConfig:
        LogGroup: !Ref ImageResizerLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref ImageMetadataTable
          PROCESSED_BUCKET: !Ref ProcessedBucket
      Events:
        ResizerQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ResizerQueue.Arn
            # One image per invocation: resizing is memory-heavy.
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        # Write-only on the processed bucket, and only the objects it creates.
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ProcessedBucket.Arn}/*"
        # It only ever updates the resize attribute of an existing item.
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ImageMetadataTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        External:
          - "@aws-sdk/*"
          - "sharp"
        Format: "cjs"
        EntryPoints:
          - src/image-resizer.ts

Outputs:
  ApiUrl:
    Description: "API Gateway HTTP API endpoint URL"
    Value: !Sub "https://${DarkroomApi}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Description: "Upload bucket name"
    Value: !Ref UploadBucket
  TableName:
    Description: "DynamoDB table name"
    Value: !Ref ImageMetadataTable
  AnalyzerDeadLetterQueueUrl:
    Description: "Where analyzer messages land after 3 failed attempts"
    Value: !Ref AnalyzerDeadLetterQueue
  ProcessedBucketName:
    Description: "Where the resizer writes the thumb and medium copies"
    Value: !Ref ProcessedBucket
  ResizerDeadLetterQueueUrl:
    Description: "Where resizer messages land after 3 failed attempts"
    Value: !Ref ResizerDeadLetterQueue
  UserPoolId:
    Description: "Cognito User Pool ID for authentication"
    Value: !Ref AuthCognitoUserPool
  UserPoolClientId:
    Description: "Cognito User Pool App Client ID"
    Value: !Ref AuthCognitoUserPoolClient
  UserPoolIssuerUrl:
    Description: "Cognito User Pool Issuer URL for JWT validation"
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AuthCognitoUserPool}"
